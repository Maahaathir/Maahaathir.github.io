<div class="newsletter-box my-4 p-4 rounded border">
  <h4 class="mt-0 mb-1">Subscribe to PhyShots</h4>
  <p class="text-muted small mb-3">
    Get concise astrophysics explainers and research notes delivered straight to your inbox.
  </p>

  <form
    action="https://buttondown.com/api/emails/embed-subscribe/mahathir"
    method="post"
    target="popupwindow"
    onsubmit="window.open('https://buttondown.com/mahathir', 'popupwindow')"
    class="d-flex flex-column flex-sm-row gap-2"
  >
    <input
      type="email"
      name="email"
      id="bd-email"
      placeholder="you@example.com"
      required
      class="form-control"
      aria-label="Email address"
    />
    <button type="submit" class="btn btn-primary px-4">
      Subscribe
    </button>
  </form>
</div>
