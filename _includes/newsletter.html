<div
  class="newsletter-box"
  style="
    margin: 2rem 0;
    padding: 1.5rem;
    border: 1px solid var(--main-border-color);
    border-radius: 0.75rem;
    background-color: var(--card-bg);
  "
>
  <h4 style="margin-top: 0; margin-bottom: 0.4rem;">Subscribe to PhyShots</h4>
  <p style="color: var(--text-muted-color); font-size: 0.92rem; margin-bottom: 1.1rem;">
    Get concise astrophysics explainers and random science news delivered straight to your inbox.
  </p>

  <form
    action="https://buttondown.com/api/emails/embed-subscribe/mahathir"
    method="post"
    target="popupwindow"
    onsubmit="window.open('https://buttondown.com/mahathir', 'popupwindow')"
    style="display: flex; flex-wrap: wrap; gap: 0.65rem;"
  >
    <input
      type="email"
      name="email"
      id="bd-email"
      placeholder="you@example.com"
      required
      class="form-control"
      aria-label="Email address"
      style="flex: 1 1 240px;"
    />
    <button
      type="submit"
      class="btn btn-primary"
      style="padding: 0.45rem 1.25rem; white-space: nowrap;"
    >
      Subscribe
    </button>
  </form>
</div>
